- id: superpowers
  name: obra/superpowers
  repo_url: https://github.com/obra/superpowers
  category: workflow
  recommendation: highly_recommended
  agents:
    - Claude Code
    - Codex
    - Cursor
    - Gemini CLI
    - OpenCode
    - GitHub Copilot CLI
  install:
    claude: "/plugin install superpowers@claude-plugins-official"
    codex: "在 Codex App 的 Plugins 侧边栏搜索 Superpowers 并安装"
    cursor: "/add-plugin superpowers"
    gemini: "gemini extensions install https://github.com/obra/superpowers"
  best_for:
    - 多文件功能开发
    - 先讨论和计划再执行
    - TDD、系统化 debugging、code review 闭环
  avoid_when:
    - 单行小改动
    - 不想引入完整流程约束
  highlights:
    - 完整软件开发方法论，而不只是单个 prompt
    - 通过 brainstorming、worktree、TDD、review 等 skills 限制 agent 乱写
    - 支持多个 coding agent 和插件安装方式
  cautions:
    - 对小任务偏重，可能增加交互成本
    - 团队采用前需要先约定 worktree 和 review 习惯
  evidence:
    - README 提供多平台安装和基础工作流
    - 社区讨论中常被用作结构化 agent 开发流程案例
  license: See repository
  last_checked: "2026-05-05"

