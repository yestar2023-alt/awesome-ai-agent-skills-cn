  repo_url: https://github.com/garrytan/gstack
  category: workflow
  recommendation: situational
  agents:
    - Claude Code
    - Codex
    - OpenClaw
  install:
    claude: "git clone --single-branch --depth 1 https://github.com/garrytan/gstack.git ~/.claude/skills/gstack && cd ~/.claude/skills/gstack && ./setup"
    team_mode: "从 gstack checkout 运行 ./setup --team，并在团队确认后提交 .claude/ 和 CLAUDE.md 变更"
  best_for:
    - founder 或技术负责人想用 agent 模拟产品、工程、设计、QA 多角色审查
